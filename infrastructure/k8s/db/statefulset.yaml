apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: guardrailx-db
spec:
  serviceName: "guardrailx-db"
  replicas: 1
  selector:
    matchLabels:
      app: guardrailx-db
  template:
    metadata:
      labels:
        app: guardrailx-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: guardrailx-db-postgres-secret
                  key: postgres_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guardrailx-db-postgres-secret
                  key: postgres_password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: guardrailx-db-postgres-secret
                  key: postgres_db
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
