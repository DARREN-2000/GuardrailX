apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-backend
  labels:
    app: aegis-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-backend
  template:
    metadata:
      labels:
        app: aegis-backend
    spec:
      containers:
        - name: backend
          image: aegis-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: aegis-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aegis-db-secret
                  key: database_url
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
