name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi
          # install package in editable mode so tests can import `app`
          pip install -e backend

      - name: Lint backend (ruff)
        run: |
          ruff check backend --fix || true

      - name: Type-check backend (mypy)
        run: |
          mypy backend/app || true

      - name: Run backend tests
        run: |
          if [ -d "backend/tests" ] && [ "$(ls -A backend/tests)" ]; then
            pytest backend/tests -q
          elif [ -d "tests" ] && [ "$(ls -A tests)" ]; then
            pytest tests -q
          else
            echo "No backend tests found, skipping."
          fi

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
