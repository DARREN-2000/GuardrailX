name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Postgres
        uses: ankane/setup-postgres@v1
        with:
          postgres-version: 15
          database: guardrailx
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi
          pip install -e backend

      - name: Lint backend (ruff)
        run: |
          ruff check backend

      - name: Type-check backend (mypy)
        run: |
          mypy backend/app backend/tests

      - name: Run backend tests
        run: |
          if [ -d "backend/tests" ] && [ "$(ls -A backend/tests)" ]; then
            cd backend && TEST_DATABASE_URL="postgresql+asyncpg://guardrailx:guardrailx@localhost:5432/guardrailx" pytest tests -q --cov=app --cov-fail-under=85 -W ignore::RuntimeWarning
          else
            echo "No backend tests found, skipping."
          fi

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
