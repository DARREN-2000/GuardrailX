<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis | Enterprise AI Governance</title>
    <meta name="description" content="The policy-driven AI governance runtime. Secure every prompt, route every model, and keep every decision auditable." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aegis.com/" />
    <meta property="og:title" content="Aegis | Enterprise AI Governance" />
    <meta property="og:description" content="The policy-driven AI governance runtime. Secure every prompt, route every model, and keep every decision auditable." />
    <meta property="og:image" content="https://aegis.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://aegis.com/" />
    <meta property="twitter:title" content="Aegis | Enterprise AI Governance" />
    <meta property="twitter:description" content="The policy-driven AI governance runtime. Secure every prompt, route every model, and keep every decision auditable." />
    <meta property="twitter:image" content="https://aegis.com/og-image.jpg" />

    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
