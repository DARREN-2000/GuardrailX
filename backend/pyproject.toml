[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrailx-backend"
version = "0.1.0"
description = "GuardrailX backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-exporter-otlp>=1.26",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.47b0",
  "mlflow>=2.10.0",
]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio",
  "pytest-cov",
  "httpx",
  "ruff>=0.0",
  "mypy>=1.8",
]

[tool.ruff]
line-length = 120
exclude = [".venv", "dist", "build", "frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C", "Q"]
ignore = ["F401", "E501", "B008"]
