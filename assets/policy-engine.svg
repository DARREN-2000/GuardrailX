<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" role="img" aria-label="Policy Engine">
  <rect width="100%" height="100%" rx="8" fill="#071026" />
  <text x="36" y="48" font-family="Inter, Arial" font-size="28" font-weight="700" fill="#F472B6">Policy Engine</text>

  <g transform="translate(40,80)" font-family="Inter, Arial">
    <rect x="0" y="0" width="140" height="40" rx="6" fill="#0b1330" stroke="#16233a" />
    <text x="16" y="26" fill="#cbd5e1">Policy-as-Code</text>

    <rect x="180" y="0" width="140" height="40" rx="6" fill="#0b1330" stroke="#16233a">
      <animate attributeName="fill" values="#0b1330;#071026;#0b1330" dur="5s" repeatCount="indefinite" />
    </rect>
    <text x="196" y="26" fill="#cbd5e1">Rules Engine</text>

    <rect x="360" y="0" width="140" height="40" rx="6" fill="#0b1330" stroke="#16233a" />
    <text x="376" y="26" fill="#cbd5e1">Decision Log</text>
  </g>
</svg>
