<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" role="img" aria-label="Core Modules">
  <rect width="100%" height="100%" rx="8" fill="#071026" />
  <text x="36" y="48" font-family="Inter, Arial" font-size="28" font-weight="700" fill="#60A5FA">Core Modules</text>

  <g transform="translate(40,70)" font-family="Inter, Arial" fill="#cbd5e1">
    <g>
      <circle cx="40" cy="30" r="20" fill="#6EE7B7">
        <animate attributeName="r" values="18;22;18" dur="3s" repeatCount="indefinite" />
      </circle>
      <text x="80" y="36">Prompt Security</text>
    </g>
    <g transform="translate(0,60)">
      <circle cx="40" cy="30" r="20" fill="#F472B6">
        <animate attributeName="cy" values="30;18;30" dur="2.6s" repeatCount="indefinite" />
      </circle>
      <text x="80" y="36">PII Protection</text>
    </g>
    <g transform="translate(0,120)">
      <circle cx="40" cy="30" r="20" fill="#60A5FA">
        <animate attributeName="cx" values="40;60;40" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="80" y="36">Content Safety</text>
    </g>
  </g>
</svg>
