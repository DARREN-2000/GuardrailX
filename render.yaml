services:
  - type: web
    name: aegis-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && pip install uvicorn && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-db
          property: connectionString
      - key: OTEL_ENABLED
        value: "false"

databases:
  - name: aegis-db
    databaseName: aegis
    user: aegis
